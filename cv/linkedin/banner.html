  .rule { width: 90px; height: 3px; background: #b8862b; margin: 22px 0 22px auto; }
  .stats { display: flex; justify-content: flex-end; gap: 0; }
  .stat { padding: 0 26px; border-left: 1px solid rgba(233,199,127,.28); text-align: center; }
  .stat:first-child { border-left: 0; }
  .stat:last-child { padding-right: 0; }
  .stat b { display: block; font-family: "Fraunces", Georgia, serif; font-size: 32px; line-height: 1; color: #fff; }
